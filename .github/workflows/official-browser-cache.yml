name: Refresh public Explorer data

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"
  push:
    branches: [official-browser-request, official-browser-cutoff-request]

permissions:
  contents: read

concurrency:
  group: marschain-official-browser-cache-${{ github.ref == 'refs/heads/official-browser-cutoff-request' && 'cutoff' || 'live' }}
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.repository == 'zhouyunqi250-create/marschain-power-site' &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/official-browser-request' ||
         github.ref == 'refs/heads/official-browser-cutoff-request')))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout collection code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch and publish the latest public receipt
        shell: bash
        env:
          REQUEST_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          cache_ref=refs/heads/official-browser-cache
          collector_args=()
          if [[ "$GITHUB_REF" == refs/heads/official-browser-cutoff-request ]]; then
            pattern='^Request a public Explorer cutoff \(([1-9][0-9]{9})\)$'
            request_message="$(printf '%s' "$REQUEST_MESSAGE")"
            if [[ "$GITHUB_EVENT_NAME" != push || ! "$request_message" =~ $pattern ]]; then
              echo 'Missing valid 08:00 request on the dedicated branch' >&2
              exit 1
            fi
            cutoff="${BASH_REMATCH[1]}"
            now="$(date +%s)"
            if (( cutoff % 86400 != 0 || cutoff - now > 540 || now - cutoff > 90 )); then
              echo '08:00 request is outside the actual sampling interval' >&2
              exit 1
            fi
            cache_ref=refs/heads/official-browser-cutoff-cache
            collector_args+=(--cutoff "$cutoff")
          fi
          receipt=official-browser.json
          scratch="$(mktemp -d)"
          previous=

          if git ls-remote --exit-code --heads origin "$cache_ref" > "$scratch/ref"; then
            git fetch --no-tags --depth=1 origin "$cache_ref"
            previous="$(git rev-parse FETCH_HEAD)"
            git show "$previous:$receipt" > "$scratch/$receipt"
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi

          python3 -m node_preview.official_relay --output "$scratch/$receipt" "${collector_args[@]}"
          if [ -n "$previous" ] && git show "$previous:$receipt" | cmp -s - "$scratch/$receipt"; then
            exit 0
          fi

          blob="$(git hash-object -w "$scratch/$receipt")"
          tree="$(printf '100644 blob %s\t%s\n' "$blob" "$receipt" | git mktree)"
          commit="$(git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" -m 'Publish current public MarsChain Explorer receipt')"
          # Live and cutoff receipts have independent branches and locks.
          git push --force-with-lease="$cache_ref:$previous" origin "$commit:$cache_ref"
