name: Provision Scoped Node Publisher Credential

on:
  workflow_dispatch:
  push:
    branches:
      - codex/node-ranking-preview
    paths:
      - .github/workflows/provision-node-publisher.yml
      - scripts/provision_node_publisher.py
      - node_preview/provisioning/node-encryption-cert.pem

permissions:
  contents: read

concurrency:
  group: marschain-node-publisher-bootstrap
  cancel-in-progress: false

jobs:
  provision:
    if: ${{ github.repository == 'zhouyunqi250-create/marschain-power-site' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public bootstrap sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preserve failure status before setup
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          destination = Path('output/node-publisher-provisioning')
          destination.mkdir(parents=True, exist_ok=True)
          (destination / 'provision-result.json').write_text(json.dumps({
              'schema': 1, 'state': 'not_started', 'action': 'SetupDependencies',
              'code': 'ProvisionerNotRun', 'credentials_encrypted': False,
          }) + '\n')
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install official RAM SDK
        run: python -m pip install 'alibabacloud_ram20150501==1.3.0'

      - name: Provision and encrypt object-scoped credential
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
        run: python scripts/provision_node_publisher.py

      - name: Save encrypted envelope and sanitized result only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: marschain-node-publisher-bootstrap-${{ github.run_id }}
          path: |
            output/node-publisher-provisioning/provision-result.json
            output/node-publisher-provisioning/node-publisher-credentials.cms
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
