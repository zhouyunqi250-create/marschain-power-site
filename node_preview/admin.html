<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarsChain 私有状态</title>
<style>body{margin:0;background:#081322;color:#d9e8f4;font:15px/1.7 system-ui,sans-serif}main{max-width:1000px;margin:40px auto;padding:0 22px}h1{font-size:28px;margin:0}p{color:#9fb4c8}a{color:#71e9d2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,details{background:#11243a;border:1px solid #24425d;border-radius:16px;padding:18px}.card span{display:block;font-size:13px;color:#a4bbcd}.card b{display:block;font-size:19px;color:#79efd2}.card.warn b{color:#f4c775}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}details{margin-top:18px}summary{cursor:pointer}small{color:#9fb4c8}</style></head>
<body><main><small>服务器管理 · 仅本机与 SSH 通道访问</small><h1>MarsChain 私有运行状态</h1><p>内部采集、发布和备份详情集中在此处。此页面由本机预览服务提供，不属于官网发布文件。</p><p><a href="/">返回排行榜预览</a> · <a href="/m/">手机版预览</a></p><div class="grid" id="cards"></div><p id="checked">正在读取…</p><details><summary>查看内部状态明细</summary><pre id="raw"></pre></details></main>
<script>(()=>{'use strict';const cards=document.querySelector('#cards');const time=v=>v?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(v*1000))+' 北京时间':'暂无成功记录';function card(label,value,note,warn){const e=document.createElement('article');e.className='card'+(warn?' warn':'');for(const [tag,txt]of [['span',label],['b',value],['small',note]]){const n=document.createElement(tag);n.textContent=txt;e.append(n)}return e}async function load(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();const c=s.collector||{},p=s.publisher||{},f=s.freshness||{};const src=s.source_publication||{};const cloud=src['cloud-publish-status']||s['cloud-publish']||{};const backup=src['github-backup-status']||s['github-backup']||{};cards.replaceChildren(card('节点采集',f.collector_delayed?'采集延迟':c.state==='ready'?'正常运行':c.state||'待检查',time(c.last_success),f.collector_delayed),card('预览更新',f.preview_delayed?'更新延迟':p.state==='ready'?'已生成':p.state||'等待生成',time(p.generated_at),f.preview_delayed),card('官网上传',cloud.state==='published'?'最近上传成功':cloud.state||'未接入',time(cloud.verified_at),cloud.state!=='published'),card('GitHub 公开快照',backup.last_success?.archive||'暂无记录',time(backup.last_success?.uploaded_at),!backup.last_success),card('完整数据库异机备份','尚未配置','需在正式部署阶段配置私有备份目的地',true));document.querySelector('#raw').textContent=JSON.stringify(s,null,2);document.querySelector('#checked').textContent='状态读取：'+time(s.generated_at)}catch(e){document.querySelector('#checked').textContent='状态读取失败：'+e.message}}load();setInterval(load,30000)})();</script></body></html>
